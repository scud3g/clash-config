# ==============================================================
# Nikki 旁路由骨架配置 v1.0（GitHub 公开托管版）
# 生成日期: 2026-11-16 ｜ 零敏感信息，可公开托管
#
# 【与完整版的唯一差异】
#   本文件去掉了 proxy-providers 段（含机场订阅 token 的部分）——
#   订阅由 Nikki 的本地 mixin 文件注入（见"本地mixin-订阅.yaml"）。
#   其余内容与 nikki-config.yaml 完全一致。
#
# 【托管方式】
#   已上传至 GitHub 公开仓库 scud3g/clash-config（零敏感信息），
#   GitHub 上的文件名为 nikki-skeleton.yaml（英文文件名，jsDelivr 最稳）。
#   Nikki 订阅 URL（jsDelivr CDN，国内直连稳定，已实测 HTTP 200）：
#   https://fastly.jsdelivr.net/gh/scud3g/clash-config@main/nikki-skeleton.yaml
#   急用最新版时把 @main 换成具体 commit 编号绕过 12h 缓存。
#
# 【更新流程】
#   改规则 → GitHub 网页编辑此文件 → Nikki 界面 Profile → 订阅 →
#   点"更新" → 重载服务。换机场不碰本文件（只改本地 mixin）。
# ==============================================================

mixed-port: 7890
allow-lan: true
bind-address: '*'
mode: rule
log-level: info
unified-delay: true
tcp-concurrent: true
external-controller: 0.0.0.0:9090
find-process-mode: strict
global-ua: chrome

profile:
  store-selected: true
  store-fake-ip: true

geox-url:
  geoip: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat'
  geosite: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat'
  mmdb: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb'
  asn: 'https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb'

# -------------------- DNS（AGH 上游 = 本段） --------------------
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  prefer-h3: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - 'rule-set:private'
    - 'rule-set:cn_domain'
    - 'rule-set:connectivity_check'
    - '+.lan'
    - '+.local'
    - '+.msftconnecttest.com'
    - '+.msftncsi.com'
  respect-rules: true
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://1.1.1.1/dns-query
    - https://8.8.8.8/dns-query
  nameserver-policy:
    'rule-set:cn_domain,private':
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query

# -------------------- 域名嗅探 --------------------
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  skip-domain:
    - '+.push.apple.com'
    - 'Mijia Cloud'

