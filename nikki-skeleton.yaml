# ==================== 订阅占位（必需，供 Nikki 校验通过） ====================
# ★ 说明：Nikki 校验要求下载的订阅文件必须含 proxies 或 proxy-providers。
#   本骨架为 A 方案分离式设计（机场 token 不放公开仓库），故用此占位 provider
#   通过 has("proxy-providers") 校验。真实节点由 /etc/nikki/mixin.yaml 的 SMJC
#   订阅在启动时深合并，整体覆盖本占位（同名同 type，后合并者胜）。
proxy-providers:
  SMJC:
    type: http
    url: https://example.com/placeholder-not-used
    interval: 86400
    path: ./providers/smjc.yaml
    proxy: DIRECT
    health-check:
      enable: true
      lazy: true
      url: https://www.gstatic.com/generate_204
      interval: 600
    override:
      udp: true

